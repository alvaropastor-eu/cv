<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlvaroPASTOR - Research CV</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
      #header {
    height: 45px;
    background: #f5f5f5;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 13px;
    position: relative;
    box-sizing: border-box; /* Ensures padding doesn't break layout */
}

#header strong {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    -webkit-transform: translateX(-50%); /* Safari support */
    text-align: center;
    width: auto;
}

#header a {
    color: #0066cc;
    text-decoration: none;
    margin-left: auto; /* Pushes to right */
    white-space: nowrap; /* Prevents text wrapping */
}

#header a:hover {
    text-decoration: underline;
}

/* Mobile responsiveness */
@media (max-width: 480px) {
    #header {
        height: 50px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 5px 10px;
            font-size: 11px;

    }
    
    #header strong {
        position: static;
        transform: none;
        -webkit-transform: none;
        order: 1;
        width: 100%;
        text-align: center;
        margin-bottom: 5px;
    }
    
    #header a {
        margin-left: 0;
        order: 2;
       
    }
}
        #viewerContainer {
            position: absolute;
            width: 100%;
            height: calc(100% - 40px);
            top: 40px;
            overflow: auto;
        }
    </style>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
</head>
<body>
    <div id="header">
        <strong>Research CV</strong>
        <a href="./AlvaroPASTOR_2025ix_T.pdf" target="_blank">Download Teaching CV</a>
    </div>
    
    <div id="viewerContainer">
        <iframe id="pdfViewer" 
                src="./pdfjs-3.0.279-legacy-dist/web/viewer.html?file=../../../AlvaroPASTOR_2025ix_R.pdf"
                width="100%" 
                height="100%" 
                frameborder="0"></iframe>
    </div>
</body>
</html>
